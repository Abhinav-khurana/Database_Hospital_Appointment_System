services:
  mongodb:
    image: mongo:7.0.14
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - hospital_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"localhost:27017\"}]}) }' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  hospital_data:
